services:

  db:
    # pgvector 0.8.7 on Postgres 18.6. The tag follows new Postgres 18 releases, so pin the digest.
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Ollama
      - GENERATION_MODEL_NAME=llama3.2
      - EMBEDDINGS_MODEL_NAME=nomic-embed-text
      - EMBEDDINGS_DIMENSIONS=768

      # Database
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=postgres
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    depends_on:
      - db

volumes:
  pgdata:
