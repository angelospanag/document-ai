[project]
name = "document-ai"
version = "0.1.0"
authors = [
    { name = "Angelos Panagiotopoulos", email = "angelospanag@protonmail.com" },
]
description = "A simple FastAPI application that allows users to upload pdf or docx documents, get a summary generated by a local LLM via Ollama, and ask questions about their content."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "langchain>=1.4.9",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = ["httpx2>=2.16.0", "pytest>=9.2.0", "ruff>=0.17.4", "ty>=0.0.98"]

[tool.ruff]
lint.select = [
    "E",
    "W", # pycodestyle
    "F", # pyflakes (undefined names, etc.)
    "B", # bugbear
    "I", # isort
    "N", # pep8-naming
    "SIM", # simplify
    "UP", # pyupgrade
    "PERF", # perflint
    "RET", # flake8-return
    "RSE", # flake8-raise
]
