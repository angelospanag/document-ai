[project]
name = "document-ai"
version = "0.1.0"
authors = [
    { name = "Angelos Panagiotopoulos", email = "angelospanag@protonmail.com" },
]
description = "A simple FastAPI application that allows users to upload pdf or docx documents, get a summary generated by a local LLM via Ollama, and ask questions about their content."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.3.16",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = ["httpx2>=2.12.0", "pytest>=9.1.1", "ruff>=0.16.4", "ty>=0.0.74"]

[tool.ruff]
lint.select = [
    "E",
    "W", # pycodestyle
    "F", # pyflakes (undefined names, etc.)
    "B", # bugbear
    "I", # isort
    "N", # pep8-naming
    "SIM", # simplify
    "UP", # pyupgrade
    "PERF", # perflint
    "RET", # flake8-return
    "RSE", # flake8-raise
]
