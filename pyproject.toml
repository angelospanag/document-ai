[project]
name = "document-ai"
version = "0.1.0"
authors = [
    { name = "Angelos Panagiotopoulos", email = "angelospanag@protonmail.com" },
]
description = "A simple FastAPI application that allows users to upload pdf or docx documents, get a summary generated by a local LLM via Ollama, and ask questions about their content."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16.2",
    "fastapi[standard]>=0.136.3",
    "langchain>=1.3.4",
    "langchain-ollama>=0.3.3",
    "langchain-text-splitters>=0.3.8",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.2.9",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.14.1",
    "pypdf>=5.6.0",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.0.41",
]

[dependency-groups]
dev = ["httpx2>=2.3.0", "pytest>=9.0.3", "ruff>=0.15.16", "ty>=0.0.43"]

[tool.ruff]
lint.select = [
    "E",
    "W", # pycodestyle
    "F", # pyflakes (undefined names, etc.)
    "B", # bugbear
    "I", # isort
    "N", # pep8-naming
    "SIM", # simplify
    "UP", # pyupgrade
    "PERF", # perflint
    "RET", # flake8-return
    "RSE", # flake8-raise
]
